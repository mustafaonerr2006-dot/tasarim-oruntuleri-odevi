name: Python CI

on:
  push:
    branches: [ main, phase-3 ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Kodu al
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Syntax kontrolu
        run: python -m py_compile src/shopping_cart.py

      - name: Programi calistir
        run: python src/shopping_cart.py
